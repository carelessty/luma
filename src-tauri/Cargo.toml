[package]
name = "luma"
version = "0.1.0"
description = "A thoughtful, fast Emby desktop client"
license = "GPL-3.0-or-later"
repository = "https://github.com/carelessty/lumo"
authors = ["Luma contributors"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "luma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
wiremock = "0.6"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
panic = "abort"
